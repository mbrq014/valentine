<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 16px 12px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .art {
      max-width: 100%;
      max-height: 30vh;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    h1 {
      font-size: clamp(20px, 3.5vw, 36px);
      margin: 10px 0 18px;
      white-space: nowrap;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn { left: 18%; background: var(--yes); color: #fff; }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn { left: 62%; background: #e5e7eb; color: #111827; }

    .hint { margin-top: 10px; font-size: 13px; opacity: .7; }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin-top: 18px;
      animation: pop .35s ease;
      width: 100%;
    }

    .result h2 { font-size: clamp(30px, 4.5vw, 46px); margin: 10px 0; }

    .fireworks {
      max-width: 100%;
      max-height: 40vh;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- Hund med hjerte -->
    <svg class="art" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="160" cy="235" rx="75" ry="12" fill="#000" opacity="0.08"/>
      <path d="M95 105 C70 95 70 60 105 65 C115 80 115 100 95 105 Z" fill="#8b5a2b"/>
      <path d="M225 105 C250 95 250 60 215 65 C205 80 205 100 225 105 Z" fill="#8b5a2b"/>
      <ellipse cx="160" cy="125" rx="70" ry="60" fill="#c58a4a"/>
      <ellipse cx="160" cy="155" rx="50" ry="30" fill="#e8b77a"/>
      <ellipse cx="160" cy="150" rx="12" ry="8" fill="#222"/>
      <path d="M160 158 L160 168" stroke="#5a3a1a" stroke-width="3"/>
      <path d="M160 168 Q150 175 140 168" stroke="#5a3a1a" stroke-width="3" fill="none"/>
      <path d="M160 168 Q170 175 180 168" stroke="#5a3a1a" stroke-width="3" fill="none"/>
      <ellipse cx="135" cy="120" rx="7" ry="9" fill="#222"/>
      <ellipse cx="185" cy="120" rx="7" ry="9" fill="#222"/>
      <circle cx="138" cy="118" r="2" fill="#fff"/>
      <circle cx="188" cy="118" r="2" fill="#fff"/>
      <ellipse cx="125" cy="200" rx="22" ry="16" fill="#b97a3d"/>
      <ellipse cx="195" cy="200" rx="22" ry="16" fill="#b97a3d"/>
      <path d="M160 185 C150 165 120 170 120 195 C120 220 160 230 160 230 C160 230 200 220 200 195 C200 170 170 165 160 185 Z" fill="#ff3b7a"/>
    </svg>

    <h1 id="question">Hans-Jørgen vil du gå på date?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Ja</button>
      <button id="noBtn">Nei</button>
    </section>

    <div class="hint" id="hint">“Nei” er litt sjenert 😈</div>

    <section class="result" id="result">
      <h2>YEY! 🎉</h2>
      <img class="fireworks" src="https://media.tenor.com/XZqcuBcpmmkAAAAM/penguins-win.gif" alt="Fireworks"/>
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const question = document.getElementById("question");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");
    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }
    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });
    function fullScreenConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({ particleCount: 12, spread: 90, startVelocity: 45, ticks: 180, origin: { x: Math.random(), y: Math.random()*0.3 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      setTimeout(() => {
        confettiInstance({ particleCount: 300, spread: 140, startVelocity: 60, ticks: 220, origin: { x: 0.5, y: 0.55 } });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.05);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width/2) - px;
      let dy = (b.top + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newLeft = (b.left - z.left) + dx*150;
      let newTop  = (b.top - z.top) + dy*150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    function handleMove(x, y) {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width/2) - x, (b.top + b.height/2) - y);
      if(d < 140) moveNo(x, y);
    }

    // ---------- Throttle for mobil / jevn animasjon ----------
    function throttle(fn, limit) {
      let waiting = false;
      return function(...args) {
        if(!waiting) {
          fn.apply(this, args);
          waiting = true;
          setTimeout(() => waiting = false, limit);
        }
      };
    }

    const throttledHandleMove = throttle(handleMove, 16); // ~60 fps

    // PC mus – original hastighet
    zone.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));

    // Mobil touch – throttlet
    zone.addEventListener("touchmove", e => { 
      if(e.touches.length>0) throttledHandleMove(e.touches[0].clientX, e.touches[0].clientY); 
    }, {passive:false});

    noBtn.addEventListener("click", e => e.preventDefault());

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      question.style.display = "none";
      result.style.display = "flex";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
